<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Graph App</title>
    <link rel="stylesheet" href="/app/styles.css">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>

<div id="left">
    <h3>Upload Config</h3>
    <div id="drop-zone">
        <p>Drop your <code>.json</code> config here</p>
        <span id="file-name">No file selected</span>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display:none">
    <button id="btn-browse" onclick="document.getElementById('fileInput').click()">Upload manually</button>
    <button onclick="deploy()">Deploy</button>

    <hr>

    <h3>Publish Message</h3>
    <input id="topic" placeholder="Topic">
    <input id="message" placeholder="Message">
    <button onclick="publish()">Send</button>

    <hr>

    <h3>Reset</h3>
    <button id="btn-reset" onclick="resetAll()">Reset all topics to 0</button>
</div>

<div id="center">
    <div id="graph"></div>
</div>

<div id="right">
    <h3>Topics</h3>
    <div id="table"></div>
</div>

<script src="/app/api.js"></script>
<script src="/app/graph.js"></script>
<script src="/app/topics.js"></script>

<script>
    initGraph();
    loadGraph();
    initDropZone();
</script>

</body>
</html>
